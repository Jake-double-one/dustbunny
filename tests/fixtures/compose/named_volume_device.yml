services:
  nextcloud:
    image: nextcloud
    volumes:
      - nc_data:/var/www/html/data
      - nfs_share:/share
volumes:
  nc_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/appdata/nextcloud/data
  nfs_share:
    driver: local
    driver_opts:
      type: nfs
      o: addr=10.0.0.5,rw
      device: ":/export/share"
  plain: {}
