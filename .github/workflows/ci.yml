name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch to build an image from (e.g. v0.1.0)
        required: true

# a newer push to the same ref replaces a still running build
concurrency:
  group: ci-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

# actions are pinned to commits (the tag is the comment) – Dependabot keeps them current
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12' # the version of the image
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -e ".[dev]"
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/pytest
      - name: Image smoke test
        run: |
          docker build -t dustbunny:ci .
          docker run --rm dustbunny:ci --version
          mkdir -p /tmp/appdata/orphan
          docker run --rm -v /tmp/appdata:/tmp/appdata:ro -e SCAN_ROOTS=/tmp/appdata -e DOCKER_ENABLED=false \
            dustbunny:ci --once --json | grep -q '"category": "orphan"'
          docker run -d --name smoke -e SCAN_ROOTS=/tmp -e DOCKER_ENABLED=false -p 18080:8080 dustbunny:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:18080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/ | grep -q 'id="skin-list"'
          docker rm -f smoke

  # pull requests build the image too (without pushing), so updates of the docker/* actions
  # are tested before they reach main
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0 # tags, for the version name of main builds
      - name: Build info
        id: info
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if [ -n "$INPUT_REF" ]; then v="$INPUT_REF"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then v="$GITHUB_REF_NAME"
          # main: the last release plus how far ahead, e.g. v0.1.0 or v0.1.0-3-g1a2b3c4
          else v="$(git describe --tags --match 'v*' 2>/dev/null || echo "0.0.0-$(git rev-parse --short HEAD)")"; fi
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"
          # a branch name like feature/x is no valid image tag
          echo "ref_tag=$(echo "$INPUT_REF" | tr '/' '-')" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Image name (registry names must be lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dustbunny" >> "$GITHUB_OUTPUT"
      - name: Tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: latest=false
          # main → latest + sha-…; tag v0.1.0 → 0.1.0, 0.1 and the tag itself; manual run → the given ref
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=tag
            type=raw,value=${{ steps.info.outputs.ref_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.info.outputs.version }}
            GIT_SHA=${{ steps.info.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # tag v1.2.3 → GitHub release "Dustbunny 1.2.3" with docs/releases/v1.2.3.md as release notes
  # (without that file, GitHub writes the notes from the commits)
  release:
    needs: image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dustbunny"
          file="docs/releases/${TAG}.md"
          {
            if [ -f "$file" ]; then cat "$file"; echo; fi
            echo "## Docker image"
            echo
            echo '```sh'
            echo "docker pull ${image}:${version}"
            echo '```'
            echo
            echo "For \`linux/amd64\` and \`linux/arm64\`. Setup: see the [README](https://github.com/${GITHUB_REPOSITORY}#install-with-docker--portainer)."
          } > release-notes.md
          args=(--title "Dustbunny ${version}" --notes-file release-notes.md)
          [ -f "$file" ] || args+=(--generate-notes)
          [[ "$version" == *-* ]] && args+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Dustbunny ${version}" --notes-file release-notes.md
          else
            gh release create "$TAG" --verify-tag "${args[@]}"
          fi
