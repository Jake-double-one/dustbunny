name: Audit

# Known vulnerabilities in what the image ships: the Python packages (pip-audit, against the
# Python advisory database and OSV) and the whole image incl. its Debian packages (Trivy).
# Runs weekly, when a dependency or the Dockerfile changes, and by hand. Image findings also
# show up under Security → Code scanning.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  push:
    branches: [main]
    paths: [pyproject.toml, Dockerfile, .github/workflows/audit.yml]
  pull_request:
    paths: [pyproject.toml, Dockerfile, .github/workflows/audit.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python packages (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12' # the version of the image
      - name: Install Dustbunny the way the image does
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet .
          .venv/bin/pip freeze --exclude dustbunny > shipped.txt
          python -m venv .audit
          .audit/bin/pip install --quiet pip-audit
      # audits exactly the packages the image ships, not pip-audit's own dependencies
      - run: .audit/bin/pip-audit --requirement shipped.txt --no-deps --disable-pip --strict --desc on

  image:
    name: Image (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # findings under Security → Code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t dustbunny:audit .
      - name: Scan for the Security tab
        uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          image-ref: dustbunny:audit
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
      # fails the job on high and critical findings that have a fix; the table is the report
      - name: Scan
        uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          image-ref: dustbunny:audit
          skip-setup-trivy: true
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'
